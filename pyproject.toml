[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai"
version = "0.1.0"
description = "Agentic AI study project — LangGraph agent, FastAPI backend, Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Agent / API
    "fastapi>=0.136.0",
    "fastapi-limiter>=0.2.0",
    "langchain>=1.2.0",
    "langchain-google-genai>=4.2.0",
    "langchain-mcp-adapters>=0.2.0",
    "langchain-postgres>=0.0.14",
    "langgraph>=1.1.0",
    "psycopg[binary]>=3.3.0",
    "pyrate-limiter>=4.0.0",
    "PyJWT>=2.12.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.45.0",
    # UI
    "requests>=2.33.0",
    "streamlit>=1.56.0",
    # MCP server
    "fastmcp>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = []
